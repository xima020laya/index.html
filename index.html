<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紧急人道主义呼吁 | 医疗救助项目</title>
  <style>
    :root {
      --primary-color: #d9534f;
      --secondary-color: #f0ad4e;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 30px;
      box-sizing: border-box;
    }

    /* === 融合整体风格的图片卡片处理 === */
    .featured-image-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
      perspective: 1000px;
    }

    .styled-image-card {
      position: relative;
      background: #ffffff;
      padding: 12px 12px 24px 12px;
      border-radius: 8px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
      transform: rotate(-1.5deg);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 360px;
      width: 100%;
    }

    .styled-image-card:hover {
      transform: rotate(0deg) scale(1.02);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
    }

    .image-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      aspect-ratio: 3 / 4;
    }

    .styled-image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    /* 微妙的暗角叠加层，增强氛围感 */
    .image-wrapper::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }

    .image-caption {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="text-align: center; color: var(--primary-color);">现场记录与影像</h2>

    <!-- 处理好的图片模块 -->
    <div class="featured-image-container">
      <div class="styled-image-card">
        <div class="image-wrapper">
          <img src="https://lh3.googleusercontent.com/d/1vgSJVpCHxuvZwFaAjImM-cM62CSyUX1b" alt="活动现场救助记录" />
        </div>
        <div class="image-caption">现场影像记录</div>
      </div>
    </div>
  </div>

</body>
</html>
